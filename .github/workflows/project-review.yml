name: Independent project review
on:
  push:
    branches: [codex/review-2026-09-14]
    paths-ignore: ['docs/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: review-only-password
          POSTGRES_DB: sara_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sara -d sara_review"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAYLOAD_CONFIG_PATH: src/payload.config.ts
      DATABASE_URI: postgres://sara:review-only-password@localhost:5432/sara_review
      PAYLOAD_SECRET: review-only-payload-secret-not-for-production-12345
      STUDENT_JWT_SECRET: review-only-student-secret-not-for-production-67890
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: review
      S3_SECRET_ACCESS_KEY: review-only-storage-password
      S3_BUCKET_PUBLIC: media-public
      S3_BUCKET_PRIVATE: media-private
      PAYMENT_PROVIDER: mock
      SMS_PROVIDER: mock
      ALLOW_OTP_DEBUG_RESPONSE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        id: install
        continue-on-error: true
        run: npm ci
      - name: Diagnostic install after lockfile failure
        if: steps.install.outcome == 'failure'
        run: npm install
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Generate types and admin import map
        id: generate
        continue-on-error: true
        run: |
          npm run generate:types
          npm run generate:importmap
      - name: Type check
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Database integration tests
        id: integration
        continue-on-error: true
        timeout-minutes: 4
        run: npm run test:integration
      - name: Seed sample content and review administrator
        id: seed
        continue-on-error: true
        env:
          FIRST_ADMIN_EMAIL: review@example.invalid
          FIRST_ADMIN_PASSWORD: review-only-password-DoNotDeploy-82719
        run: |
          npm run seed
          npm run create-first-admin
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Start application, inspect browser, and run E2E
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        id: e2e
        timeout-minutes: 5
        env:
          E2E_SKIP_WEBSERVER: '1'
          E2E_ADMIN_EMAIL: review@example.invalid
          E2E_ADMIN_PASSWORD: review-only-password-DoNotDeploy-82719
        run: |
          npm run dev > /tmp/sara-dev.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/sara-dev.log' EXIT
          for attempt in $(seq 1 45); do
            if curl -s --max-time 2 http://localhost:3000/api/health > /tmp/sara-health.json; then break; fi
            sleep 2
          done
          cat /tmp/sara-health.json
          curl -sS --max-time 60 -o /tmp/sara-home.html -w 'Home HTTP %{http_code}\n' http://localhost:3000/
          curl -sS --max-time 60 -o /tmp/sara-stream.txt -w 'Stream API HTTP %{http_code}\n' http://localhost:3000/api/lessons/1/stream-url
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test'
          import { mkdir } from 'node:fs/promises'
          await mkdir('.review', { recursive: true })
          const browser = await chromium.launch()
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            await page.goto('http://localhost:3000/', { waitUntil: 'networkidle' })
            await page.screenshot({ path: '.review/home-desktop.png', fullPage: true })
            await page.goto('http://localhost:3000/packages/paye-poodr-gel', { waitUntil: 'networkidle' })
            const desktop = {
              packageHeading: await page.locator('h1').innerText(),
              seededLessonVisible: await page.getByText('[نمونه] درس ۱: معرفی ابزار (رایگان)', { exact: true }).count(),
              mainMenuVisible: await page.getByRole('navigation', { name: 'منوی اصلی' }).isVisible(),
              purchaseLinkCount: await page.getByRole('link', { name: 'خرید پکیج', exact: true }).count(),
            }
            await page.screenshot({ path: '.review/package-desktop.png', fullPage: true })
            await page.setViewportSize({ width: 390, height: 844 })
            const mobile = {
              mainMenuVisible: await page.getByRole('navigation', { name: 'منوی اصلی' }).isVisible(),
              horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth),
            }
            await page.screenshot({ path: '.review/package-mobile.png', fullPage: true })
            console.log('BROWSER_DIAGNOSTICS ' + JSON.stringify({ desktop, mobile }))
          } finally {
            await browser.close()
          }
          JS
          npm run test:e2e -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-review-browser-evidence
          path: |
            .review/
            test-results/
          retention-days: 7
      - name: Review result
        if: always()
        env:
          E2E: ${{ steps.e2e.outcome }}
          SEED: ${{ steps.seed.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          node -e 'const names=["UNIT","LINT","GENERATE","TYPES","BUILD","INTEGRATION","SEED","E2E"]; for(const n of names) console.log(n+": "+process.env[n]); if(names.some(n=>process.env[n]!=="success")) process.exitCode=1'
