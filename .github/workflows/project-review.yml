name: Independent project review
on:
  push:
    branches: [codex/review-2026-09-14]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: review-only-password
          POSTGRES_DB: sara_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sara -d sara_review"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PAYLOAD_CONFIG_PATH: src/payload.config.ts
      DATABASE_URI: postgres://sara:review-only-password@localhost:5432/sara_review
      PAYLOAD_SECRET: review-only-payload-secret-not-for-production-12345
      STUDENT_JWT_SECRET: review-only-student-secret-not-for-production-67890
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: review
      S3_SECRET_ACCESS_KEY: review-only-storage-password
      S3_BUCKET_PUBLIC: media-public
      S3_BUCKET_PRIVATE: media-private
      PAYMENT_PROVIDER: mock
      SMS_PROVIDER: mock
      ALLOW_OTP_DEBUG_RESPONSE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Generate types and admin import map
        id: generate
        continue-on-error: true
        run: |
          npm run generate:types
          npm run generate:importmap
      - name: Type check
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Database integration tests
        id: integration
        continue-on-error: true
        timeout-minutes: 4
        run: npm run test:integration
      - name: Review result
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          node -e 'const names=["UNIT","LINT","GENERATE","TYPES","BUILD","INTEGRATION"]; for(const n of names) console.log(n+": "+process.env[n]); if(names.some(n=>process.env[n]!=="success")) process.exitCode=1'
